<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flappy Tesla</title>
<style>
:root{color-scheme:light dark;--bg:#e8eef2;--ink:#14181c;--red:#e31937;--card:#ffffffcc}
@media (prefers-color-scheme:dark){:root{--bg:#0d1115;--ink:#f1f4f6;--card:#161c22cc}}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}
#wrap{height:100%;display:flex;align-items:center;justify-content:center}
#stage{position:relative;height:100%;max-height:760px;aspect-ratio:9/14;max-width:100%}
canvas{width:100%;height:100%;display:block;border-radius:14px;box-shadow:0 8px 30px #0004}
#ui{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
#ui .box{background:#0b1620d9;backdrop-filter:blur(6px);padding:18px 28px;border-radius:14px;color:#fff}
h1{margin:0 0 6px;font-size:36px;letter-spacing:1px;color:#fff;font-family:"Courier New",monospace;text-transform:uppercase;text-shadow:3px 0 #000,-3px 0 #000,0 3px #000,0 -3px #000,2px 2px #000,-2px -2px #000,2px -2px #000,-2px 2px #000}
p{margin:4px 0;font-size:16px}
.lb{margin-top:10px;font-size:14px;text-align:left;min-width:190px}.lb b{display:block;text-align:center;margin-bottom:4px;color:var(--red)}.lb .row{display:flex;justify-content:space-between;gap:16px;padding:1px 0}
#nick{position:absolute;left:24px;right:24px;bottom:74px;display:none}
#ca{position:absolute;left:12px;right:12px;bottom:14px;display:none;text-align:center;pointer-events:none;animation:fl 2.4s ease-in-out infinite}#ca button{pointer-events:auto}@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@media (prefers-reduced-motion:reduce){#ca{animation:none}}#ca>*{display:inline-block;vertical-align:middle}#ca span{background:#0b1620e6;color:#fff;padding:7px 10px;border-radius:8px 0 0 8px;font:12px "Courier New",monospace}#ca button{background:#e31937;color:#fff;border:0;padding:7px 10px;border-radius:0 8px 8px 0;font:bold 12px "Courier New",monospace;cursor:pointer}#nick input{width:100%;box-sizing:border-box;padding:8px 10px;border-radius:8px;border:2px solid #e31937;background:#0b1620f2;color:#fff;text-align:center;font-size:16px}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
<canvas id="c" width="360" height="560"></canvas>
<div id="nick"><input id="nm" maxlength="12" placeholder="Your name for the leaderboard" autocomplete="off"></div>
<div id="ca"></div>
<div id="ui"><div class="box" id="msg"><h1>Flappy Tesla</h1><p>Tap, click or press space to fly</p><p>Dodge the pipes. Don't crash the Roadster.</p><p>Grab the rocket for a shield boost and the battery for an extra life.</p></div></div>
</div></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=360,H=560,msg=document.getElementById('msg');
const GAP=150,PW=60,SPEED=2.2,GROUND=60;
let lives=0,shield=0,boost=0,toast='',toastT=0,parts=[],car,pipes,score,best=0,state='intro',frame=0,clouds=[];
try{best=+localStorage.getItem('ft-best')||0}catch(e){}
for(let i=0;i<5;i++)clouds.push({x:Math.random()*W,y:40+Math.random()*200,s:.3+Math.random()*.4});
function reset(){lives=0;shield=0;boost=0;parts=[];car={x:90,y:H/2-30,v:0,r:0};pipes=[];score=0;frame=0;addPipe(W+60);addPipe(W+60+190)}
function addPipe(x){const top=70+Math.random()*(H-GROUND-GAP-140),r=Math.random();pipes.push({x,top,done:false,item:r<.14?'rocket':r<.27?'life':null})}
function flap(){
  if(performance.now()-lastIntro<150)return;
  if(state==='intro'){endIntro();return}
  if(state==='ready'){state='play';msg.parentNode.style.display='none'}
  if(state==='play'){car.v=-6.4;puff()}
  else if(state==='over'&&frame>30){reset();state='ready';showMsg('<h1>Flappy Tesla</h1><p>Tap to fly</p>')}
}
let lastMsg=msg.innerHTML,db=null,myId=null,lb=[],dbBest=0;
const nm=document.getElementById('nm'),nbar=document.getElementById('nick');
function esc(s){return String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';')}
function lbHTML(){if(!db&&!sbOn)return '';return '<div class="lb"><b>Top pilots</b>'+(lb.length?lb.slice(0,5).map((r,i)=>'<div class="row"><span>'+(i+1)+'. '+esc(r.name||'Anonymous')+'</span><span>'+(+r.best||0)+'</span></div>').join(''):'<div class="row"><span>No scores yet</span></div>')+'</div>'}
function showMsg(h){lastMsg=h;msg.innerHTML=h+lbHTML();msg.parentNode.style.display='flex'}
function refreshMsg(){if(state!=='play')msg.innerHTML=lastMsg+lbHTML()}
let nickOK=false;
const CA='AM1jZRnE9MwrtX3EPcdczCFLeVYtgvHgtbNQttZZpump';
const caEl=document.getElementById('ca');
if(CA){
  caEl.innerHTML='<span>CA: '+esc(CA.slice(0,6)+'...'+CA.slice(-4))+'</span><button id="cab">Copy</button>';
  const cab=document.getElementById('cab');
  cab.onclick=()=>{try{navigator.clipboard.writeText(CA)}catch(e){}cab.textContent='Copied';setTimeout(()=>{cab.textContent='Copy'},1500)};
  caEl.addEventListener('pointerdown',e=>e.stopPropagation());
}
function syncNick(){const shown=msg.parentNode.style.display!=='none';nbar.style.display=nickOK&&shown?'block':'none';caEl.style.display=CA?'block':'none'}
new MutationObserver(syncNick).observe(msg.parentNode,{attributes:true,attributeFilter:['style']});
const SB_URL='https://aoqfnuvrjghtageszryo.supabase.co',SB_KEY='sb_publishable_jwntUQ-J52MFjJ_bSzTMGw_WB4kfehJ';
let sbOn=false,sbBest=0;
try{sbBest=+localStorage.getItem('ft-sb')||0}catch(e){}
async function sbLoad(){
  try{
    const r=await fetch(SB_URL+'/rest/v1/scores?select=name,score&order=score.desc&limit=50',{headers:{apikey:SB_KEY}});
    if(!r.ok)return;
    const rows=await r.json(),seen={};lb=[];
    rows.forEach(x=>{const k=String(x.name).toLowerCase();if(!seen[k]){seen[k]=1;lb.push({name:x.name,best:x.score})}});
    lb=lb.slice(0,10);refreshMsg();
  }catch(e){}
}
function initSB(){
  if(!SB_URL||!SB_KEY)return;
  sbOn=true;nickOK=true;syncNick();
  try{nm.value=localStorage.getItem('ft-nick')||''}catch(e){}
  sbLoad();setInterval(sbLoad,30000);
}
async function submit(s){
  if(sbOn){
    if(s<1||s<=sbBest)return;
    const name=(nm.value||'').trim().slice(0,12)||'Anonymous';
    try{localStorage.setItem('ft-nick',name)}catch(e){}
    try{
      const r=await fetch(SB_URL+'/rest/v1/scores',{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({name,score:s})});
      if(r.ok){sbBest=s;try{localStorage.setItem('ft-sb',s)}catch(e){}sbLoad()}
    }catch(e){}
    return;
  }
  if(!db||!myId||s<1||s<=dbBest)return;
  const name=(nm.value||'').trim().slice(0,12)||'Anonymous';
  try{await db.doc('scores/'+myId).set({name,best:s,t:Date.now()});dbBest=s}catch(e){}
}
async function initLB(){
  try{
    if(!window.claude){initSB();return}
    const d=await claude.use('db'),u=await claude.use('user');
    if(!d||!u)return;
    const id=await u.id();if(!id)return;
    db=d;myId=id;nickOK=true;syncNick();
    try{nm.value=localStorage.getItem('ft-nick')||''}catch(e){}
    try{const me=await db.doc('scores/'+id).get();if(me.exists){dbBest=+me.data().best||0;if(!nm.value)nm.value=me.data().name||''}}catch(e){}
    db.collection('scores').orderBy('best','desc').limit(10).onSnapshot(s=>{lb=s.docs.map(x=>x.data());refreshMsg()},()=>{});
  }catch(e){db=null}
}
nbar.addEventListener('pointerdown',e=>e.stopPropagation());
nm.addEventListener('change',async()=>{
  const name=nm.value.trim().slice(0,12);
  try{localStorage.setItem('ft-nick',name)}catch(e){}
  if(db&&myId&&dbBest>0&&name){try{await db.doc('scores/'+myId).update({name})}catch(e){}}
});
function die(){
  state='over';frame=0;
  if(score>best){best=score;try{localStorage.setItem('ft-best',best)}catch(e){}}
  submit(score);
  showMsg('<h1>Crashed!</h1><p>Score: '+score+'</p><p>Best: '+best+'</p><p>Tap to retry</p>');
}
function update(){
  frame++;
  clouds.forEach(c=>{c.x-=c.s;if(c.x<-60)c.x=W+60});
  parts.forEach(p=>{p.x+=p.vx-(state==='play'?SPEED:0);p.y+=p.vy;p.vy*=.95;p.s+=.35;p.l-=.045});parts=parts.filter(p=>p.l>0);
  if(state==='over'){car.v+=.5;car.y=Math.min(car.y+car.v,H-GROUND-26);car.r=Math.min(car.r+.05,1.2);return}
  if(state==='intro'){stepIntro();return}
  if(state==='ready'){car.y=H/2-30+Math.sin(frame/12)*8;return}
  car.v+=.36;car.y+=car.v;car.r=Math.max(-.4,Math.min(car.v*.07,1));
  const sp=boost>0?SPEED*1.8:SPEED;bgx+=sp;pipes.forEach(p=>p.x-=sp);if(boost>0){boost--;if(frame%3===0)puff()}if(shield>0)shield--;if(toastT>0)toastT--;
  if(pipes[0].x<-PW)pipes.shift();
  if(pipes[pipes.length-1].x<W-190)addPipe(W+20);
  pipes.forEach(p=>{
    if(!p.done&&p.x+PW<car.x){p.done=true;score++}
    const cx=car.x,cy=car.y,hw=34,hh=14;
    if(p.item){const ix=p.x+PW/2,iy=p.top+GAP/2;if(Math.abs(ix-cx)<32&&Math.abs(iy-cy)<28){if(p.item==='rocket'){shield=300;boost=120;say('Rocket boost!')}else{lives++;say('Extra life!')}p.item=null}}
    if(cx+hw>p.x&&cx-hw<p.x+PW&&(cy-hh<p.top||cy+hh>p.top+GAP))hit();
  });
  if(car.y+14>H-GROUND){if(hit()){car.y=H-GROUND-16;car.v=-7}}else if(car.y<-20){if(hit()){car.y=-20;car.v=1}}
}
function say(t){toast=t;toastT=90}
const IS=5,WR=360,RR=330,PM=.96,stars=Array.from({length:50},()=>({x:Math.random()*W,y:Math.random()*(H-GROUND-90),r:Math.random()<.2?2:1,a:.4+Math.random()*.6}));
let iw=0,ip=-1,lastIntro=0;
function endIntro(){lastIntro=performance.now();state='ready';ip=-1;car.x=90;car.y=H/2-30;car.r=0;car.sy=1;car.fl=false;msg.parentNode.style.display='flex';refreshMsg()}
function stepIntro(){
  if(ip<0){
    iw+=IS;
    const s=Math.min((iw-WR)/RR,Math.sin(PM));
    if(s<=0){car.x=90;car.y=487.5;car.r=0}
    else{const f=Math.asin(s);car.x=90-12.5*Math.sin(f);car.y=500-RR*(1-Math.cos(f))-12.5*Math.cos(f);car.r=-f}
    car.sy=1;car.fl=false;
    if(s>=Math.sin(PM)-1e-6)ip=0;
  }else{
    ip+=1/70;const p=Math.min(ip,1),e=p*p*(3-2*p);
    iw+=IS*(1-.8*e);
    car.x=79.8+10.2*e;car.y=352-102*e-80*Math.sin(Math.PI*p);
    car.r=-PM*(1-e);car.sy=Math.cos(Math.PI*2*e);car.fl=true;
    if(frame%3===0)puff();
    if(ip>=1)endIntro();
  }
}
function pl(pts){ctx.beginPath();pts.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.stroke()}
function drawIntro(){
  const day=ip<0?0:Math.min(1,Math.max(0,(ip-.35)/.65)),a=1-day;
  if(a<=0)return;
  const cam=iw-90;
  ctx.save();ctx.globalAlpha=a;
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#03050a');g.addColorStop(1,'#111a22');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#fff';
  stars.forEach(s=>{ctx.globalAlpha=a*s.a;ctx.fillRect(s.x,s.y,s.r,s.r)});
  ctx.globalAlpha=a;
  ctx.fillStyle='#1b2127';ctx.fillRect(0,H-GROUND,W,GROUND);
  ctx.fillStyle='#c9b23a';
  for(let x=-(((cam%60)+60)%60);x<W;x+=60)if(x<WR-cam-20)ctx.fillRect(x,H-GROUND+28,24,4);
  const rp=f=>[WR+RR*Math.sin(f)-cam+15*Math.sin(f),500-RR*(1-Math.cos(f))+15*Math.cos(f)];
  const pts=[[WR-700-cam,515]];
  for(let f=0;f<PM;f+=.04)pts.push(rp(f));
  pts.push(rp(PM));
  ctx.lineJoin='round';
  ctx.shadowColor='#ff2b45';ctx.shadowBlur=14;ctx.strokeStyle='#e31937';ctx.lineWidth=34;pl(pts);
  ctx.shadowBlur=0;ctx.strokeStyle='#7d868d';ctx.lineWidth=30;pl(pts);
  ctx.strokeStyle='#d5dbe0';ctx.lineWidth=2;ctx.setLineDash([14,12]);pl(pts);ctx.setLineDash([]);
  ctx.globalAlpha=.5*a;ctx.fillStyle='#fff';ctx.font='13px "Trebuchet MS",sans-serif';ctx.textAlign='center';ctx.fillText('Tap to skip',W/2,H-18);
  ctx.restore();
}
function hit(){
  if(shield>0)return true;
  if(lives>0){lives--;shield=90;car.v=-5;say('Extra life used');return true}
  die();return false;
}
function drawRocket(x,y){
  ctx.save();ctx.translate(x,y);ctx.rotate(.5+Math.sin(frame/10)*.08);
  const g=ctx.createLinearGradient(-6,0,6,0);g.addColorStop(0,'#9aa4ab');g.addColorStop(.5,'#f2f5f7');g.addColorStop(1,'#8d979e');
  ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(0,-20);ctx.quadraticCurveTo(7,-10,6,12);ctx.lineTo(-6,12);ctx.quadraticCurveTo(-7,-10,0,-20);ctx.fill();
  ctx.fillStyle='#2b343b';ctx.fillRect(-6,-2,12,2);
  ctx.fillStyle='#8d979e';ctx.beginPath();ctx.moveTo(-6,6);ctx.lineTo(-11,15);ctx.lineTo(-6,12);ctx.fill();ctx.beginPath();ctx.moveTo(6,6);ctx.lineTo(11,15);ctx.lineTo(6,12);ctx.fill();
  const L=8+Math.random()*7,f=ctx.createLinearGradient(0,12,0,12+L);f.addColorStop(0,'#fff');f.addColorStop(.5,'#ffb347');f.addColorStop(1,'#ff6a0000');
  ctx.fillStyle=f;ctx.beginPath();ctx.moveTo(-4,12);ctx.lineTo(4,12);ctx.lineTo(0,12+L);ctx.fill();
  ctx.restore();
}
function drawLife(x,y){
  ctx.save();ctx.translate(x,y+Math.sin(frame/12)*3);
  ctx.fillStyle='#e8ecef';ctx.strokeStyle='#8f9aa3';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.rect(-11,-14,22,28);ctx.fill();ctx.stroke();
  ctx.fillStyle='#8f9aa3';ctx.fillRect(-4,-17,8,3);
  ctx.fillStyle='#3ddc84';ctx.beginPath();ctx.moveTo(2,-9);ctx.lineTo(-6,2);ctx.lineTo(-1,2);ctx.lineTo(-3,10);ctx.lineTo(6,-2);ctx.lineTo(1,-2);ctx.closePath();ctx.fill();
  ctx.restore();
}
function drawFX(){
  if(shield>0&&state!=='over'){
    const a=shield<60&&Math.floor(shield/6)%2?.15:.35;
    ctx.save();ctx.translate(car.x,car.y);ctx.fillStyle='rgba(120,200,255,'+a+')';ctx.strokeStyle='rgba(200,235,255,.9)';ctx.lineWidth=2;
    ctx.beginPath();ctx.ellipse(0,0,48,28,0,0,7);ctx.fill();ctx.stroke();ctx.restore();
  }
  ctx.textAlign='left';ctx.font='bold 18px "Trebuchet MS",sans-serif';ctx.fillStyle='#fff';ctx.strokeStyle='#0008';ctx.lineWidth=4;
  if(state!=='over'&&lives>0){const t='Lives: '+lives;ctx.strokeText(t,12,28);ctx.fillText(t,12,28)}
  if(toastT>0){ctx.textAlign='center';ctx.font='bold 22px "Trebuchet MS",sans-serif';ctx.globalAlpha=Math.min(1,toastT/20);ctx.strokeText(toast,W/2,115);ctx.fillText(toast,W/2,115);ctx.globalAlpha=1}
}
let bgx=0;
const SKY=Array.from({length:14},(_,i)=>({x:i*28+Math.random()*8,w:18+Math.random()*14,h:35+Math.random()*75}));
const TOWN=Array.from({length:10},(_,i)=>({x:i*72+Math.random()*20,k:Math.random()<.5?'p':'h',c:['#e7c58b','#ebdca6','#9ec7e0','#e2ab8e'][i%4]}));
function palm(x,y){
  ctx.fillStyle='#7a5530';ctx.fillRect(x,y-44,4,44);
  ctx.fillStyle='#3f9a49';
  ctx.fillRect(x-14,y-48,14,4);ctx.fillRect(x+4,y-48,14,4);ctx.fillRect(x-8,y-54,22,5);ctx.fillRect(x-18,y-44,8,4);ctx.fillRect(x+12,y-44,8,4);ctx.fillRect(x-2,y-59,8,5);
}
function house(x,y,c){
  ctx.fillStyle=c;ctx.fillRect(x,y-22,34,22);
  ctx.fillStyle='#a0522d';ctx.fillRect(x-3,y-28,40,7);
  ctx.fillStyle='#8fd0ea';ctx.fillRect(x+5,y-17,7,7);ctx.fillRect(x+22,y-17,7,7);
  ctx.fillStyle='#7a5a3a';ctx.fillRect(x+14,y-10,7,10);
}
function drawScenery(){
  ctx.fillStyle='#ffffffe6';
  clouds.forEach(c=>{const x=Math.round(c.x),y=Math.round(c.y);ctx.fillRect(x-22,y,44,10);ctx.fillRect(x-12,y-8,26,8);ctx.fillRect(x+6,y-4,24,6)});
  ctx.fillStyle='#86b9cc';
  SKY.forEach(s=>{const sx=(((s.x-bgx*.12)%392)+392)%392-30;ctx.fillRect(Math.round(sx),Math.round(470-s.h),Math.round(s.w),Math.round(s.h)+30)});
  ctx.fillStyle='#6fb86c';
  for(let x=0;x<W;x+=4){const h=14+10*Math.sin((x+bgx*.3)/38)+6*Math.sin((x+bgx*.3)/17);ctx.fillRect(x,Math.round(478-h),4,50)}
  const gx=Math.round((((300-bgx*.3)%720)+720)%720-150);
  if(gx<W){
    ctx.fillStyle='#eef1f2';ctx.fillRect(gx,452,130,20);ctx.fillStyle='#c8283a';ctx.fillRect(gx,449,130,4);ctx.fillStyle='#b9c0c4';ctx.fillRect(gx,468,130,4);
    ctx.fillStyle='#6f777d';ctx.font='bold 8px "Courier New",monospace';ctx.textAlign='center';ctx.fillText('GIGAFACTORY',gx+65,464);
  }
  TOWN.forEach(t=>{const tx=Math.round((((t.x-bgx*.6)%720)+720)%720-60);if(tx<W+20){if(t.k==='p')palm(tx,494);else house(tx,494,t.c)}});
  ctx.fillStyle='#84cc66';ctx.fillRect(0,484,W,16);ctx.fillStyle='#6db54f';ctx.fillRect(0,484,W,3);
}
function drawPipe(x,y,h,flip){
  const o='#2a2e31';
  ctx.fillStyle=o;ctx.fillRect(x-1,y,PW+2,h);
  ctx.fillStyle='#b4babe';ctx.fillRect(x+1,y,PW-2,h);
  ctx.fillStyle='#d3d8db';ctx.fillRect(x+3,y,12,h);
  ctx.fillStyle='#8f969b';ctx.fillRect(x+PW-14,y,12,h);
  const cy=flip?y+h-24:y;
  ctx.fillStyle=o;ctx.fillRect(x-6,cy,PW+12,24);
  ctx.fillStyle='#a9b0b5';ctx.fillRect(x-4,cy+2,PW+8,20);
  ctx.fillStyle='#d0d6d9';ctx.fillRect(x-4,cy+2,PW+8,6);
  const sh=Math.min(66,h-46);
  if(sh>16){
    const sy=flip?cy-10-sh:cy+34,sx=x+PW/2;
    ctx.fillStyle='#d0243a';ctx.beginPath();ctx.ellipse(sx,sy+sh/2,13,sh/2,0,0,7);ctx.fill();
    ctx.fillStyle='#7d878d';ctx.beginPath();ctx.ellipse(sx,sy+sh/2,8,sh/2-5,0,0,7);ctx.fill();
  }
  if(!flip){ctx.fillStyle='#c8283a';ctx.font='bold 9px "Courier New",monospace';ctx.textAlign='center';ctx.fillText('TESLA',x+PW/2,cy+17)}
}
function drawPipeOld(x,y,h,flip){
  ctx.fillStyle='#8a949c';ctx.fillRect(x,y,PW,h);
  ctx.fillStyle='#b9c2c9';ctx.fillRect(x+6,y,10,h);
  ctx.fillStyle='#5f6a72';ctx.fillRect(x-4,flip?y+h-22:y,PW+8,22);
  ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--red');
  ctx.fillRect(x-4,flip?y+h-22:y+19,PW+8,3);
}
function puff(){
  for(let i=0;i<7;i++)[-10,10].forEach(o=>parts.push({x:car.x+o,y:car.y+9,vx:(Math.random()-.5)*1.6,vy:1.5+Math.random()*2.5,s:3+Math.random()*3,l:1}));
}
function drawCar(){
  parts.forEach(p=>{ctx.globalAlpha=Math.max(0,p.l)*.65;ctx.fillStyle='#f4fbff';ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,7);ctx.fill()});
  ctx.globalAlpha=1;
  ctx.save();ctx.translate(car.x,car.y);ctx.rotate(car.r);
  ctx.scale(1,car.sy===undefined?1:car.sy);const on=state==='ready'||(state==='intro'&&car.fl)||(state==='play'&&car.v<1);
  if(on){
    [-10,10].forEach(x=>{
      const L=9+Math.random()*9+(state==='play'&&car.v<-3?9:0);
      const g=ctx.createLinearGradient(0,7,0,7+L);
      g.addColorStop(0,'#ffffff');g.addColorStop(.45,'#9fdcff');g.addColorStop(1,'#9fdcff00');
      ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(x-3.5,7);ctx.lineTo(x+3.5,7);ctx.lineTo(x,7+L);ctx.fill();
    });
  }
  const bg=ctx.createLinearGradient(0,-12,0,7);bg.addColorStop(0,'#ffffff');bg.addColorStop(1,'#cdd4da');ctx.fillStyle=bg;
  ctx.beginPath();
  ctx.moveTo(-37,6);ctx.lineTo(-37,-1);
  ctx.quadraticCurveTo(-36,-4,-26,-5);ctx.lineTo(-14,-6);
  ctx.quadraticCurveTo(-8,-12,0,-12);
  ctx.quadraticCurveTo(6,-11,14,-4);
  ctx.quadraticCurveTo(30,-3,37,2);
  ctx.quadraticCurveTo(39,4,37,7);
  ctx.lineTo(-37,7);ctx.closePath();ctx.fill();ctx.strokeStyle='#8f9aa3';ctx.lineWidth=.8;ctx.stroke();
  ctx.fillStyle='#17222b';
  ctx.beginPath();ctx.moveTo(-12,-5.5);ctx.quadraticCurveTo(-7,-10.5,0,-10.5);ctx.quadraticCurveTo(5,-9.5,11,-4.5);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#b4bdc4';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(-34,-1.5);ctx.quadraticCurveTo(0,-3,34,1);ctx.stroke();
  ctx.fillStyle='#1b1b1b';ctx.fillRect(-36,5,73,2.5);
  ctx.fillStyle='#fff3c0';ctx.beginPath();ctx.moveTo(29,-1);ctx.lineTo(37,2);ctx.lineTo(29,2);ctx.fill();
  ctx.fillStyle='#ff2b2b';ctx.fillRect(-37,-1,2.5,3);
  ctx.fillStyle='#fff';ctx.fillRect(-2.5,-1,5,1.4);ctx.fillRect(-.7,-1,1.4,4.5);
  [-22,22].forEach(x=>{
    ctx.fillStyle='#0c0c0c';ctx.beginPath();ctx.arc(x,5,7.5,0,7);ctx.fill();
    ctx.fillStyle='#c9ced2';ctx.beginPath();ctx.arc(x,5,4,0,7);ctx.fill();
    ctx.fillStyle='#555';ctx.beginPath();ctx.arc(x,5,1.4,0,7);ctx.fill();
  });
  ctx.restore();
}
function drawCarOld(){
  ctx.save();ctx.translate(car.x,car.y);ctx.rotate(car.r);
  ctx.fillStyle='#e31937';
  ctx.beginPath();ctx.moveTo(-34,8);ctx.lineTo(-34,-2);ctx.quadraticCurveTo(-30,-6,-14,-7);
  ctx.quadraticCurveTo(-4,-18,10,-17);ctx.quadraticCurveTo(20,-16,24,-6);
  ctx.quadraticCurveTo(34,-4,35,4);ctx.lineTo(35,8);ctx.closePath();ctx.fill();
  ctx.fillStyle='#bfe6f5';
  ctx.beginPath();ctx.moveTo(-10,-7);ctx.quadraticCurveTo(-3,-14,9,-14);ctx.lineTo(19,-7);ctx.closePath();ctx.fill();
  ctx.fillStyle='#fff';ctx.fillRect(2,-14,2,7);
  ctx.fillStyle='#111';
  [-20,20].forEach(x=>{ctx.beginPath();ctx.arc(x,9,7,0,7);ctx.fill()});
  ctx.fillStyle='#ccc';
  [-20,20].forEach(x=>{ctx.beginPath();ctx.arc(x,9,3,0,7);ctx.fill()});
  ctx.fillStyle='#ffe98a';ctx.fillRect(31,-1,5,3);
  // T badge
  ctx.fillStyle='#fff';ctx.fillRect(-2,0,6,1.6);ctx.fillRect(0,0,2,6);
  if(state==='play'){ctx.fillStyle='#ff9a2e';ctx.beginPath();ctx.moveTo(-34,3);ctx.lineTo(-44-Math.random()*8,5);ctx.lineTo(-34,8);ctx.fill()}
  ctx.restore();
}
function draw(){
  const dark=matchMedia('(prefers-color-scheme:dark)').matches;
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#52b2cf');g.addColorStop(1,'#a6e0ea');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle=dark?'#ffffff22':'#ffffffcc';
  drawScenery();
  pipes.forEach(p=>{drawPipe(p.x,0,p.top,true);drawPipe(p.x,p.top+GAP,H-GROUND-p.top-GAP,false);
    if(p.item){const ix=p.x+PW/2,iy=p.top+GAP/2;ctx.fillStyle='#ffffff66';ctx.beginPath();ctx.arc(ix,iy,24,0,7);ctx.fill();if(p.item==='rocket')drawRocket(ix,iy);else drawLife(ix,iy)}});
  ctx.fillStyle='#e0dca2';ctx.fillRect(0,H-GROUND,W,GROUND);ctx.fillStyle='#d2cb8e';ctx.fillRect(0,H-GROUND,W,4);ctx.fillStyle='#4c5156';ctx.fillRect(0,H-GROUND+4,W,32);ctx.fillStyle='#3c4044';ctx.fillRect(0,H-GROUND+34,W,2);
  ctx.fillStyle='#e6eaec';
  const off=state==='play'?(frame*SPEED)%40:0;
  for(let x=-off;x<W;x+=40)ctx.fillRect(x,H-GROUND+28,22,4);
  if(state==='intro')drawIntro();drawCar();drawFX();
  if(state!=='over'&&state!=='intro'){
    ctx.fillStyle='#fff';ctx.strokeStyle='#0008';ctx.lineWidth=5;ctx.font='bold 44px "Courier New",monospace';ctx.textAlign='center';
    ctx.strokeText(score,W/2,70);ctx.fillText(score,W/2,70);
  }
}
function loop(){update();draw();requestAnimationFrame(loop)}
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();flap()}});
cv.addEventListener('pointerdown',e=>{e.preventDefault();flap()});
document.getElementById('wrap').addEventListener('pointerdown',flap);
reset();msg.parentNode.style.display='none';loop();initLB();
</script>
